[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rts-forensics"
version = "0.1.0"
description = "Exploratory raw-observation RTS prism network forensics"
readme = "docs/index.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "pandas>=2.2", "scipy>=1.11", "PyYAML>=6", "matplotlib>=3.7"]

[project.optional-dependencies]
web = ["streamlit>=1.30", "altair>=5"]
dev = ["pytest>=8", "ruff>=0.9", "build", "mkdocs>=1.6"]

[project.scripts]
rts-forensics = "rts_forensics.cli:main"

[tool.setuptools.packages.find]
include = ["rts_forensics*", "prismacore*"]

[tool.setuptools.package-data]
prismacore = ["*.json"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
